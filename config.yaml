# Scoot Keyboard — ergogen source (one reversible half; flip to build the mirror half).
#
# Layout: Corne 3x5+3 (18 keys/half) + a roller encoder in the inner pocket and,
# on the peripheral build only, a face-down PMW3360 desk-mouse sensor. See README.md.
#
# Electrically this is DIRECT-WIRED, no diodes: every switch pulls one MCU GPIO to GND
# (QMK DIRECT_PINS). There is no matrix and no per-key diode.
#
# Footprints: the RP2040 MCU uses the custom footprints/mcu_rp2040_pro_micro.js (in this
# repo); the rest use the ceoloide library (reversible/hotswap). Validate in the ergogen
# web UI (app.ergogen.xyz) with both injected — the plain CLI ships only built-in
# footprints. Geometry (points/outlines) renders on the CLI as-is.
#
# TWO FOOTPRINT GAPS remain, marked `TODO` below — no drop-in footprint exists, so each is
# a real sourcing decision:
#   1. roller  — Scoot uses an EVQWGD001 low-profile roller; placeholder is an EC11.
#   2. sensor  — PMW3360/3389 breakout; no footprint yet (optional, peripheral-only).
points:
  key.tags:
    - key
  zones:
    matrix:
      anchor:
        shift: [150, -150] # Fix KiCad placement
      columns:
        c1:                    # outer / pinky
        c2.key.stagger: u/4    # ring
        c3.key.stagger: u/8    # middle
        c4.key.stagger: -u/8   # index
        c5.key.stagger: -u/8   # inner index
      rows:
        r3:
        r2:
        r1:
    thumbfan:
      anchor:
        - ref: matrix_c3_r3
          shift: [9.5,-22]
      columns:
        t1:
        t2.key:
          splay: -15
          stagger: -2.7
          spread: u + 2
        t3.key:
          splay: 75
          stagger: 2
          spread: u + 2
      rows:
        r0:
    roller:                    # EVQWGD001 roller, inner pocket beside the index key
      key.tags:
        - helper
      anchor:
        - ref: matrix_c5_r3
          shift: [16, -8]
          rotate: -30
    sensor:                    # PMW3360 desk-mouse sensor — face-down, peripheral build only
      key.tags:
        - helper
      anchor:
        - ref: matrix_c3_r3
          shift: [u/2, u/2]
    mcu:
      key.tags:
        - helper
      anchor:
        - ref: matrix_c5_r1
          shift: [u/2+18/2+1.6,u/2-33/2]
    screw_1:
      key.tags:
        - helper
        - screw
      anchor:
        aggregate.parts:
          - ref: matrix_c1_r1
          - ref: matrix_c2_r1
          - ref: matrix_c1_r2
          - ref: matrix_c2_r2
    screw_2:
      key.tags:
        - helper
        - screw
      anchor:
        aggregate.parts:
          - ref: matrix_c4_r1
          - ref: matrix_c4_r2
          - ref: matrix_c5_r1
          - ref: matrix_c5_r2
    screw_3:
      key.tags:
        - helper
        - screw
      anchor:
        aggregate.parts:
          - ref: matrix_c1_r2
          - ref: matrix_c1_r3
          - ref: matrix_c2_r2
          - ref: matrix_c2_r3
    screw_4:
      key.tags:
        - helper
        - screw
      anchor:
        aggregate.parts:
          - ref: matrix_c2_r3
          - ref: thumbfan_t1_r0
        shift: [0.4,-2.675]
    screw_5:
      key.tags:
        - helper
        - screw
      anchor:
        ref: thumbfan_t3_r0
        shift: [0,12]
    # Underglow LEDs — a short ring near the board perimeter, on the SAME SK6812 chain as the
    # per-key LEDs (see the `led_*` footprints below). Tagged `led`/`helper` so they are NOT
    # picked up as keys (no keycap, no switch, no matrix net). Positions are PROVISIONAL —
    # nudge along the final board edge once the outline is locked.
    ug1:
      key.tags: [helper, led]
      anchor:
        - ref: matrix_c2_r1
          shift: [0, u/2+2]
    ug2:
      key.tags: [helper, led]
      anchor:
        - ref: matrix_c4_r1
          shift: [0, u/2+2]
    ug3:
      key.tags: [helper, led]
      anchor:
        - ref: matrix_c5_r2
          shift: [u/2+2, 0]
    ug4:
      key.tags: [helper, led]
      anchor:
        - ref: matrix_c4_r3
          shift: [0, -u/2-2]
    ug5:
      key.tags: [helper, led]
      anchor:
        - ref: matrix_c2_r3
          shift: [0, -u/2-2]
    ug6:
      key.tags: [helper, led]
      anchor:
        - ref: matrix_c1_r2
          shift: [-u/2-2, 0]
outlines:
  _keycaps:
    - what: rectangle
      where: [key]
      size: 18
      fillet: 3
  _mcu:
    - what: rectangle
      where: [mcu]
      size: [17.78,33]
      fillet: 1
    - what: rectangle
      where: [mcu]
      size: [8.94,7.35]
      fillet: 0.1
      operation: stack
      adjust:
        shift: [0,33/2-7.35/2+0.7]
  _roller:
    - what: rectangle
      where: [roller]
      size: [11,20]
      fillet: 0.5
  _sensor:
    - what: circle
      where: [sensor]
      radius: 11
  _keys:
    - what: rectangle
      where: /matrix/
      size: u
    - what: polygon
      points:
        - ref: matrix_c2_r1
          shift: [u/2,-u/2]
        - ref: thumbfan_t1_r0
          shift: [-u/2,u/2]
          affect: [x]
        - ref: thumbfan_t1_r0
          shift: [-u/2,u/2]
          affect: [y]
        - ref: thumbfan_t2_r0
          shift: [u/2,u/2]
          affect: [x,y]
        - ref: matrix_c5_r3
          shift: [u/2,-u]
        - ref: matrix_c5_r3
          shift: [u/2,-u/2]
  _screw_heads:
    - what: circle
      where: [screw]
      radius: 4.3/2
  scoot:
    - what: rectangle
      where: [key]
      size: u
    - what: rectangle
      where: [matrix_c5_r1]
      size: [1.6,3u]
      adjust:
        shift: [u/2+1.6/2,-u]
    - what: rectangle
      where: [mcu]
      size: [18,33]
    - what: rectangle
      where: [roller]
      size: [15,25]
    - what: polygon
      fillet: 1   # single uniform fillet on the whole board (last part); keeps corners squared
      points:
        - ref: matrix_c1_r3
          shift: [u/2,-u/2]
        - ref: matrix_c2_r3
          shift: [u/2,-u/2-u/4]
        - ref: thumbfan_t1_r0
          shift: [-u/2,-u/2]
          affect: [x,y]
        - ref: thumbfan_t2_r0
          shift: [u/2,-u/2]
          affect: [x,y]
        - ref: thumbfan_t3_r0
          shift: [-u/2,-u/2]
          affect: [x,y]
        - ref: thumbfan_t3_r0
          shift: [u/2,-u/2]
          affect: [x,y]
        - ref: mcu
          shift: [0,33/2]
          affect: [y]
        - ref: matrix_c5_r2
          shift: [-u/2,0]
          affect: [x]
        - ref: matrix_c1_r2
          shift: [u/2,u/2]
          affect: [x,y]
  preview:
    - what: outline
      name: scoot
    - what: outline
      name: _keycaps
      operation: stack
    - what: outline
      name: _mcu
      operation: stack
    - what: outline
      name: _roller
      operation: stack
    - what: outline
      name: _sensor
      operation: stack
    - what: outline
      name: _screw_heads
      operation: stack
pcbs:
  scoot_pcb:
    template: kicad8
    outlines:
      board:
        outline: scoot
    footprints:
      m2_screws:
        what: ceoloide/mounting_hole_npth
        where: /screw/
        params:
          hole_size: 4.6
          hole_drill: 2.2
      # DIRECT-WIRED switches: one GPIO per key, pulled to GND. No matrix, no diodes.
      # Each key's net is its own point name (e.g. "matrix_c1_r1"); the MCU pin map below
      # connects those nets to GPIOs.
      switches:
        what: ceoloide/switch_choc_v1_v2
        where:
          - /matrix_c[1-5]_r[1-3]/
          - /thumbfan_t[1-3]_r0/
        params:
          from: "{{name}}"
          to: GND
          choc_v1_support: false
          include_plated_holes: false
          hotswap: true
          reversible: true
          include_stabilizer_pad: false
        adjust:
          rotate: 180
      # RP2040 "Pro Micro" — custom footprint in footprints/mcu_rp2040_pro_micro.js.
      # Reversible THT (mount on either face; firmware/QMK handles the L/R pin mirror when
      # the board is flipped for the other half). P0..P21 are the 18 direct-wired keys;
      # P100..P107 are the RP2040's extra broken-out GPIO carrying roller/LED/sensor/tether.
      # NOTE: extra-pin positions are vendor-specific — verify against your actual module.
      mcu:
        what: scoot/mcu_rp2040_pro_micro
        where: mcu
        params:
          reversible: true
          include_extra_pins: true
          P0:  "matrix_c1_r1"
          P1:  "matrix_c1_r2"
          P2:  "matrix_c1_r3"
          P3:  "matrix_c2_r1"
          P4:  "matrix_c2_r2"
          P5:  "matrix_c2_r3"
          P6:  "matrix_c3_r1"
          P7:  "matrix_c3_r2"
          P8:  "matrix_c3_r3"
          P9:  "matrix_c4_r1"
          P10: "matrix_c4_r2"
          P14: "matrix_c4_r3"
          P15: "matrix_c5_r1"
          P16: "matrix_c5_r2"
          P18: "matrix_c5_r3"
          P19: "thumbfan_t1_r0"
          P20: "thumbfan_t2_r0"
          P21: "thumbfan_t3_r0"
          # extra pins → roller / LED / sensor SPI / inter-half tether
          P100: "ROLLER_A"
          P101: "ROLLER_B"
          P102: "LED_DI"
          P103: "SENSOR_SCK"
          P104: "SENSOR_MOSI"
          P105: "SENSOR_MISO"
          P106: "SENSOR_CS"
          P107: "TETHER_UART"
      # TODO(footprint): Scoot's roller is an EVQWGD001 (low-profile scroll encoder).
      # This EC11 is a stand-in for placement/nets only — swap the footprint.
      roller:
        what: ceoloide/rotary_encoder_ec11_ec12
        where: roller
        params:
          reversible: true
          A: "ROLLER_A"
          B: "ROLLER_B"
          C: GND
      # ── RGB: per-key + underglow, ONE SK6812 MINI-E daisy-chain (decided; see README) ──
      # Addressable RGB, WS2812 protocol → QMK RGB Matrix (per-key reactive effects like
      # splash, plus the ambient underglow). The whole chain is ONE data line: it costs
      # exactly 1 GPIO (LED_DI) regardless of LED count — count only scales 5 V current, a
      # non-issue on the wired rail.
      #
      # Footprint pin map (ceoloide/led_sk6812mini-e): P1=VCC, P3=GND, P4=Data-IN, P2=Data-OUT.
      # Chaining: each LED's DIN (P4) takes the previous LED's DOUT (P2) via the `led_NN`
      # nets; a LED's DOUT is named `led_(N+1)`, so the chain reads top-to-bottom. Order is a
      # serpentine over the keys (c1↓ c2↑ c3↓ c4↑ c5↓, then the thumb fan), then out to the
      # underglow ring ug1..ug6. `reverse_mount: true` = per-key (LED faces up through the
      # switch); underglow uses `reverse_mount: false`. The two halves light INDEPENDENTLY —
      # this chain never crosses the tether (RGB sync between halves is a documented non-goal).
      # `where` can't thread a series chain, so every LED is an explicit block (expected).
      # NOTE(build): confirm the per-key LED faces/clears your Choc + hotswap stack.
      led_key_01: { what: ceoloide/led_sk6812mini-e, where: [matrix_c1_r1], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: LED_DI, P2: led_02 } }
      led_key_02: { what: ceoloide/led_sk6812mini-e, where: [matrix_c1_r2], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_02, P2: led_03 } }
      led_key_03: { what: ceoloide/led_sk6812mini-e, where: [matrix_c1_r3], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_03, P2: led_04 } }
      led_key_04: { what: ceoloide/led_sk6812mini-e, where: [matrix_c2_r3], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_04, P2: led_05 } }
      led_key_05: { what: ceoloide/led_sk6812mini-e, where: [matrix_c2_r2], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_05, P2: led_06 } }
      led_key_06: { what: ceoloide/led_sk6812mini-e, where: [matrix_c2_r1], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_06, P2: led_07 } }
      led_key_07: { what: ceoloide/led_sk6812mini-e, where: [matrix_c3_r1], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_07, P2: led_08 } }
      led_key_08: { what: ceoloide/led_sk6812mini-e, where: [matrix_c3_r2], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_08, P2: led_09 } }
      led_key_09: { what: ceoloide/led_sk6812mini-e, where: [matrix_c3_r3], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_09, P2: led_10 } }
      led_key_10: { what: ceoloide/led_sk6812mini-e, where: [matrix_c4_r3], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_10, P2: led_11 } }
      led_key_11: { what: ceoloide/led_sk6812mini-e, where: [matrix_c4_r2], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_11, P2: led_12 } }
      led_key_12: { what: ceoloide/led_sk6812mini-e, where: [matrix_c4_r1], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_12, P2: led_13 } }
      led_key_13: { what: ceoloide/led_sk6812mini-e, where: [matrix_c5_r1], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_13, P2: led_14 } }
      led_key_14: { what: ceoloide/led_sk6812mini-e, where: [matrix_c5_r2], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_14, P2: led_15 } }
      led_key_15: { what: ceoloide/led_sk6812mini-e, where: [matrix_c5_r3], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_15, P2: led_16 } }
      led_key_16: { what: ceoloide/led_sk6812mini-e, where: [thumbfan_t1_r0], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_16, P2: led_17 } }
      led_key_17: { what: ceoloide/led_sk6812mini-e, where: [thumbfan_t2_r0], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_17, P2: led_18 } }
      led_key_18: { what: ceoloide/led_sk6812mini-e, where: [thumbfan_t3_r0], params: { reversible: true, reverse_mount: true, P1: VCC, P3: GND, P4: led_18, P2: led_19 } }
      led_ug_19:  { what: ceoloide/led_sk6812mini-e, where: [ug1], params: { reversible: true, reverse_mount: false, P1: VCC, P3: GND, P4: led_19, P2: led_20 } }
      led_ug_20:  { what: ceoloide/led_sk6812mini-e, where: [ug2], params: { reversible: true, reverse_mount: false, P1: VCC, P3: GND, P4: led_20, P2: led_21 } }
      led_ug_21:  { what: ceoloide/led_sk6812mini-e, where: [ug3], params: { reversible: true, reverse_mount: false, P1: VCC, P3: GND, P4: led_21, P2: led_22 } }
      led_ug_22:  { what: ceoloide/led_sk6812mini-e, where: [ug4], params: { reversible: true, reverse_mount: false, P1: VCC, P3: GND, P4: led_22, P2: led_23 } }
      led_ug_23:  { what: ceoloide/led_sk6812mini-e, where: [ug5], params: { reversible: true, reverse_mount: false, P1: VCC, P3: GND, P4: led_23, P2: led_24 } }
      led_ug_24:  { what: ceoloide/led_sk6812mini-e, where: [ug6], params: { reversible: true, reverse_mount: false, P1: VCC, P3: GND, P4: led_24, P2: LED_DO } }
      reset_switch:
        what: ceoloide/reset_switch_tht_top
        where: mcu
        params:
          reversible: true
        adjust:
          shift: [0,-33/2 - 4]
      # TODO(footprint): PMW3360/3389 desk-mouse sensor breakout — no ergogen footprint yet.
      # It is a face-down, bottom-side, PERIPHERAL-ONLY optional part (SPI: SCK/MOSI/MISO/CS
      # + MOT on the RP2040's spare pins). Add its breakout header footprint at `where: sensor`.
