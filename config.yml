units:
  kx: cx
  ky: cy
  px: kx + 2
  py: ky + 2
  voff: 7 # vertical offset of the MCU-area footprints
  standoff_size: 5
  hole1_x: -0.5 kx - 1
  hole1_y: -0.5 ky + 0.5
  hole2_x: -0.52 kx
  hole2_y: -0.35 ky
  hole3_x: 0.5 kx + 1
  hole3_y: 0. ky - 0.5
  hole4_x: 0.5 kx - 5
  hole4_y: -0.5 ky - 2.1
  hole5_x: -0.5 kx - 0.6
  hole5_y: -0.6 ky + 1.5
  wall_thickness: 1.2
  print_fit_tolerance: 0.2
  $default_width: 18
  $default_height: 17

points:
  zones:
    main:
      anchor.shift: [50, -100]
      key:
        padding: 1ky
        spread: 1kx
      # Each key carries its own MCU pin (column_net, direct-wired to GND) and its slot in the
      # LED chain (led_din/led_dout, where one LED's DOUT feeds the next LED's DIN).
      columns:
        pinky:
          rows:
            top: { column_net: P0, led_din: LED_DATA, led_dout: led1 }
            home: { column_net: P1, led_din: led1, led_dout: led2 }
            bottom: { column_net: P2, led_din: led2, led_dout: led3 }
        ring:
          key.stagger: 0.7ky
          rows:
            top: { column_net: P3, led_din: led3, led_dout: led4 }
            home: { column_net: P4, led_din: led4, led_dout: led5 }
            bottom: { column_net: P5, led_din: led5, led_dout: led6 }
        middle:
          key.stagger: 0.25ky
          rows:
            top: { column_net: P6, led_din: led6, led_dout: led7 }
            home: { column_net: P7, led_din: led7, led_dout: led8 }
            bottom: { column_net: P8, led_din: led8, led_dout: led9 }
        index:
          key.stagger: -0.2ky
          rows:
            top: { column_net: P9, led_din: led9, led_dout: led10 }
            home: { column_net: P10, led_din: led10, led_dout: led11 }
            bottom: { column_net: P14, led_din: led11, led_dout: led12 }
        inner:
          key.stagger: -0.15ky
          rows:
            top: { column_net: P15, led_din: led12, led_dout: led13 }
            home: { column_net: P16, led_din: led13, led_dout: led14 }
            bottom: { column_net: P18, led_din: led14, led_dout: led15 }
      rows:
        bottom:
        home:
        top:
    thumb:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        ref: main_index_bottom
        shift: [-0.4kx, -1.1ky]
      columns:
        near:
          key.name: thumb_near
          key.column_net: P19
          key.led_din: led15
          key.led_dout: led16
        mid:
          key.splay: -15
          key.origin: [-0.5kx, -0.5ky]
          key.name: thumb_mid
          key.column_net: P20
          key.led_din: led16
          key.led_dout: led17
        far:
          key.splay: -15
          key.origin: [-0.5kx, -0.5ky]
          key.name: thumb_far
          key.column_net: P21
          key.led_din: led17
          key.led_dout: LED_DOUT
      rows:
        thumb-cluster:

outlines:
  raw:
    - what: rectangle
      where: true
      size: [px, py]
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5, ky-0.5]
  key-plug:
    - what: rectangle
      where: true
      size: [13.8, 13.8]
  mcu:
    - what: rectangle
      where:
        - ref: main_inner_top
          shift: [19.5, -20 - voff]
      size: [22, 62]
  thumb_outline:
    - what: polygon
      operation: stack
      points:
        - ref: thumb_near
          shift: [-0.5px, 0.75py]
        - ref: main_inner_bottom
          shift: [0.45px, -0.5py]
        - ref: thumb_far
          shift: [-0.5px, 0.5py]
        - ref: thumb_far
          shift: [0.5px, 0.5py]
        - ref: thumb_far
          shift: [0.5px, -0.5py]
        - ref: thumb_far
          shift: [-0.5px, -0.5075py]
        - ref: thumb_near
          shift: [0.5px, -0.5py]
        - ref: thumb_near
          shift: [-0.5px, -0.5py]
  key_section: [raw, thumb_outline]
  key_thumb_mcu: [key_section, mcu]
  top_plate_cutouts: [key-plug]
  top_plate:
    - name: key_section
    - operation: subtract
      name: top_plate_cutouts
      fillet: 1
  board_outline:
    - name: key_thumb_mcu
      expand: 0.1
      fillet: 1
  back_plate:
    - name: board_outline
      expand: wall_thickness + print_fit_tolerance
      fillet: 1
  all_key_outline:
    - name: board_outline
    - operation: subtract
      name: keys

pcbs:
  scoot:
    template: kicad8
    outlines:
      main:
        outline: board_outline
    footprints:
      choc_hotswap:
        what: ceoloide/switch_choc_v1_v2
        where: true
        params:
          from: "{{column_net}}"
          to: GND
          include_corner_marks: true
          include_keycap: true
          keycap_height: 16.5
          keycap_width: 17.5
          reversible: true
          hotswap: true
          choc_v2_support: false

      per_key_led:
        what: ceoloide/led_sk6812mini-e
        where: true
        params:
          reversible: true
          reverse_mount: true
          P4: "{{led_din}}"
          P2: "{{led_dout}}"
        adjust:
          shift: [0, -4.7] # below the switch center (Choc per-key position)

      mcu:
        what: ceoloide/mcu_nice_nano
        where:
          - ref: main_inner_home
            shift: [19.8, 10.8 - voff]
        params:
          reversible: true
          reverse_mount: true
          show_silk_labels: false
          # only_required_jumpers exposes the extra pins (P101/P102) on a reversible board;
          # GPIO handedness then moves to firmware. P101 carries the LED chain's data line.
          only_required_jumpers: true
          include_extra_pins: true
          P101: LED_DATA

      reset:
        what: ceoloide/reset_switch_smd_side
        params:
          reversible: true
        where:
          - ref: main_inner_home
            shift: [28.3, -10.2 - voff]
            rotate: -90

      hole_1:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_middle_top
            shift: [hole1_x, hole1_y]
        params:
          hole_size: standoff_size
          hole_drill: standoff_size
      hole_2:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_inner_top
            shift: [hole2_x, hole2_y]
        params:
          hole_size: standoff_size
          hole_drill: standoff_size
      hole_3:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: thumb_mid
            shift: [hole3_x, hole3_y]
        params:
          hole_size: standoff_size
          hole_drill: standoff_size
      hole_4:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_index_bottom
            shift: [hole4_x, hole4_y]
        params:
          hole_size: standoff_size
          hole_drill: standoff_size
      hole_5:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_ring_home
            shift: [hole5_x, hole5_y]
        params:
          hole_size: standoff_size
          hole_drill: standoff_size

  # Optional FR4 plates for case fabrication (not part of the main PCB).
  scoot-back-plate:
    template: kicad8
    outlines:
      main:
        outline: back_plate
    footprints:
      hole_1:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_middle_top
            shift: [hole1_x, hole1_y]
      hole_2:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_inner_top
            shift: [hole2_x, hole2_y]
      hole_3:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: thumb_mid
            shift: [hole3_x, hole3_y]
      hole_4:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_index_bottom
            shift: [hole4_x, hole4_y]
      hole_5:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_ring_home
            shift: [hole5_x, hole5_y]

  scoot-top-plate:
    template: kicad8
    outlines:
      main:
        outline: top_plate
    footprints:
      hole_1:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_middle_top
            shift: [hole1_x, hole1_y]
      hole_2:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_inner_top
            shift: [hole2_x, hole2_y]
      hole_3:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: thumb_mid
            shift: [hole3_x, hole3_y]
      hole_4:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_index_bottom
            shift: [hole4_x, hole4_y]
      hole_5:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_ring_home
            shift: [hole5_x, hole5_y]
