units:
  # Proxy Spacing Variables
  kx: cx #choc spaced
  ky: cy
  # Padding Variables
  px: kx + 2
  py: ky + 2

  # vertical offset of mcu area items
  voff: 7

  # pinky splay angles
  spang: 8
  pinksprd: 0.5

  standoff_size: 5 #size for standoff holes on pcb
  screen_standoff_size: 2

  hole1_x: -0.5 kx - 1
  hole1_y: -0.5 ky + 0.5

  hole2_x: -0.52 kx
  hole2_y: -0.35 ky

  hole3_x: 0.5 kx + 1
  hole3_y: 0. ky - 0.5

  hole4_x: 0.5 kx - 5
  hole4_y: -0.5 ky - 2.1

  hole5_x: -0.5 kx - 0.6
  hole5_y: -0.6 ky + 1.5

  wall_thickness: 1.2 # account for the thickness in 3D printed case/plate
  print_fit_tolerance: 0.2 # give the case some overlap beyond pcb

  # display correct choc sizing
  $default_width: 18
  $default_height: 17

points:
  zones:
    main:
      anchor.shift: [50, -100] # Fix KiCad placement
      key:
        padding: 1ky # is this extra spacing necessary or will 1 allow spacing for keycaps?
        spread: 1kx
      # Direct wiring: each key gets its own MCU pin as its net (no matrix, no diodes).
      # The nice!nano footprint exposes each pin as a net named after it, so pointing a key's
      # column_net at "P0" wires that key straight to pin P0.
      #
      # Per-key SK6812 LED chain: each key also carries led_din/led_dout, where one LED's DOUT
      # is the next LED's DIN. The chain runs LED_DATA → (18 per-key LEDs) → LED_DOUT.
      columns:
        pinky:
          rows:
            top:    { column_net: P0, led_din: LED_DATA, led_dout: led1 }
            home:   { column_net: P1, led_din: led1, led_dout: led2 }
            bottom: { column_net: P2, led_din: led2, led_dout: led3 }
        ring:
          key.stagger: 0.7ky
          rows:
            top:    { column_net: P3, led_din: led3, led_dout: led4 }
            home:   { column_net: P4, led_din: led4, led_dout: led5 }
            bottom: { column_net: P5, led_din: led5, led_dout: led6 }
        middle:
          key.stagger: 0.25ky
          rows:
            top:    { column_net: P6, led_din: led6, led_dout: led7 }
            home:   { column_net: P7, led_din: led7, led_dout: led8 }
            bottom: { column_net: P8, led_din: led8, led_dout: led9 }
        index:
          key.stagger: -0.2ky
          rows:
            top:    { column_net: P9, led_din: led9, led_dout: led10 }
            home:   { column_net: P10, led_din: led10, led_dout: led11 }
            bottom: { column_net: P14, led_din: led11, led_dout: led12 }
        inner:
          key.stagger: -0.15ky
          rows:
            top:    { column_net: P15, led_din: led12, led_dout: led13 }
            home:   { column_net: P16, led_din: led13, led_dout: led14 }
            bottom: { column_net: P18, led_din: led14, led_dout: led15 }
      rows:
        bottom:
        home:
        top:
    thumb:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        ref: main_index_bottom
        shift: [-0.4kx, -1.25ky]
      columns:
        near:
          key.name: thumb_near
          key.column_net: P19
          key.led_din: led15
          key.led_dout: led16
        mid:
          key.splay: -15
          key.origin: [-0.5kx, -0.5ky]
          key.name: thumb_mid
          key.column_net: P20
          key.led_din: led16
          key.led_dout: led17
        far:
          key.splay: -15
          key.origin: [-0.5kx, -0.5ky]
          key.name: thumb_far
          key.column_net: P21
          key.led_din: led17
          key.led_dout: LED_DOUT
      rows:
        thumb-cluster:

outlines:
  # just the keys
  raw:
    - what: rectangle
      where: true
      size: [px, py]

  # keys without padding
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5, ky-0.5]

  # keys without padding
  key-plug:
    - what: rectangle
      where: true
      size: [13.8, 13.8]

  mcu:
    - what: rectangle
      where:
        - ref: main_inner_top
          shift: [19.5, -20 - voff] # v2 - Creates more space between inner key col and mcu (issue #4)
      size: [22, 62]

  # draw thumb cluster outline
  thumb_outline:
    - what: polygon
      operation: stack
      # bound: true
      points:
        - ref: thumb_near
          shift: [-0.5px, 0.75py]
        - ref: main_inner_bottom
          shift: [0.45px, -0.5py]

        - ref: thumb_far
          shift: [-0.5px, 0.5py]
        - ref: thumb_far
          shift: [0.5px, 0.5py]
        - ref: thumb_far
          shift: [0.5px, -0.5py]
        - ref: thumb_far
          shift: [-0.5px, -0.5075py]

        - ref: thumb_near
          shift: [0.5px, -0.5py]
        - ref: thumb_near
          shift: [-0.5px, -0.5py]

  # combine keys with thumb cluster
  key_section: [raw, thumb_outline]
  key_thumb_mcu: [key_section, mcu]

  top_plate_cutouts: [key-plug] #, mcu_key_shave]

  top_plate:
    - name: key_section
      # expand: print_fit_tolerance + wall_thickness
    - operation: subtract
      name: top_plate_cutouts
      fillet: 1

  board_outline:
    - name: key_thumb_mcu
      expand: 0.1 # padding on outer edge or board
      fillet: 1

  back_plate:
    - name: board_outline
      expand: wall_thickness + print_fit_tolerance
      fillet: 1

  # Combination preview showing outline and keys.
  all_key_outline:
    - name: board_outline
    - operation: subtract
      name: keys

pcbs:
  scoot:
    template: kicad8
    outlines:
      main:
        outline: board_outline
    footprints:
      choc_hotswap:
        what: ceoloide/switch_choc_v1_v2
        where: true
        params:
          from: "{{column_net}}"
          to: GND
          include_corner_marks: true
          include_keycap: true
          keycap_height: 16.5
          keycap_width: 17.5
          reversible: true
          hotswap: true
          choc_v2_support: false

      # Per-key SK6812 MINI-E, one under each key (reverse_mount = shines through the PCB).
      # DIN/DOUT come from each key's led_din/led_dout, forming the daisy chain; VCC/GND are
      # shared nets by default.
      per_key_led:
        what: ceoloide/led_sk6812mini-e
        where: true
        params:
          reversible: true
          reverse_mount: true
          P4: "{{led_din}}"
          P2: "{{led_dout}}"
        adjust:
          shift: [0, -4.7] # below the switch center (Choc per-key position) — verified in KiCad

      mcu:
        what: ceoloide/mcu_nice_nano
        where:
          - ref: main_inner_home
            shift: [19.8, 10.8 - voff] # v2 - creates more space between mcu and key colums (issue #5) : v1:18.8
        params:
          reversible: true
          reverse_mount: true
          show_silk_labels: false
          # only_required_jumpers: hardware jumpers only on the power/reset rows; GPIO
          # handedness is done in firmware. This is what exposes the extra pins (P101/P102)
          # on a reversible board — we route the LED chain's data line to P101.
          only_required_jumpers: true
          include_extra_pins: true
          P101: LED_DATA
          # Other pins default to a net named after each pin (P0 → net "P0" …); the keys point
          # their column_net at those names, so no further pin map is needed.

      reset:
        what: ceoloide/reset_switch_smd_side
        params:
          reversible: true
        where:
          - ref: main_inner_home
            shift: [28.3, -10.2 - voff]
            rotate: -90

      label_name:
        what: ceoloide/utility_text
        where:
          - ref: main_index_home
            shift: [0, -0.5ky +1.45]
        params:
          text: "SCOOT"
          height: 2
          width: 2
          knockout: true
          reversible: true

      ver:
        what: ceoloide/utility_text
        where:
          - ref: main_index_home
            shift: [0.5kx, -0.5ky +1.45]
        params:
          text: "v0.1"
          reversible: true

      label_by:
        what: ceoloide/utility_text
        where:
          - ref: thumb_far
            shift: [0, -3]
            # rotate: 30
        params:
          text: "by xonha"
          side: "B"
          reversible: true

      hole_1:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_middle_top
            shift: [hole1_x, hole1_y]

        params:
          hole_size: standoff_size
          hole_drill: standoff_size
      hole_2:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_inner_top
            shift: [hole2_x, hole2_y]
        params:
          hole_size: standoff_size
          hole_drill: standoff_size
      hole_3:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: thumb_mid
            shift: [hole3_x, hole3_y]
        params:
          hole_size: standoff_size
          hole_drill: standoff_size
      hole_4:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_index_bottom
            shift: [hole4_x, hole4_y]
        params:
          hole_size: standoff_size
          hole_drill: standoff_size
      hole_5:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_ring_home
            shift: [hole5_x, hole5_y]
        params:
          hole_size: standoff_size
          hole_drill: standoff_size

  ## these are not used in v.1.1, but they might be useful down the road for better case building, or fabricating FR4 plates
  ##### BACKPLATE PCB
  scoot-back-plate:
    template: kicad8
    outlines:
      main:
        outline: back_plate
    footprints:
      hole_1:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_middle_top
            shift: [hole1_x, hole1_y]
      hole_2:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_inner_top
            shift: [hole2_x, hole2_y]
      hole_3:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: thumb_mid
            shift: [hole3_x, hole3_y]
      hole_4:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_index_bottom
            shift: [hole4_x, hole4_y]
      hole_5:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_ring_home
            shift: [hole5_x, hole5_y]

  ###### TOPPLATE
  scoot-top-plate:
    template: kicad8
    outlines:
      main:
        outline: top_plate
    footprints:
      hole_1:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_middle_top
            shift: [hole1_x, hole1_y]
      hole_2:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_inner_top
            shift: [hole2_x, hole2_y]
      hole_3:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: thumb_mid
            shift: [hole3_x, hole3_y]
      hole_4:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_index_bottom
            shift: [hole4_x, hole4_y]
      hole_5:
        what: ceoloide/mounting_hole_npth
        where:
          - ref: main_ring_home
            shift: [hole5_x, hole5_y]
